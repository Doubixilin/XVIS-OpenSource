# Include only inside the your own HTTPS server block.
location ^~ /xvis/ {
    # Hub separately bounds files to 16 MiB, images to 6 MiB and JSON to 64 KiB.
    client_max_body_size 17m;
    error_page 413 = @xvis_body_too_large;
    proxy_pass http://127.0.0.1:18300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
location @xvis_body_too_large {
    default_type application/json;
    return 400 '{"error":{"code":"body_too_large","message":"请求内容过大"}}';
}
