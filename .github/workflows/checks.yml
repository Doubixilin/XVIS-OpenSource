name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/check.py
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select an available iPhone simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          phones = [d['udid'] for key, devices in data['devices'].items() if 'iOS' in key
                    for d in devices if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not phones:
              raise SystemExit('An iPhone simulator with iOS 26+ SDK support is required')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('XVIS_SIMULATOR=' + phones[0] + '\n')
          PY
      - name: Run signed simulator tests
        run: >-
          xcodebuild -project ios/XVIS.xcodeproj -scheme XVIS
          -configuration Debug -destination "platform=iOS Simulator,id=$XVIS_SIMULATOR"
          -derivedDataPath local_private/ios-ci
          -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
